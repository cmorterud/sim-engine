# What cannot move is worth more for its cost (`[premiums]`, 2026-11-25): point defenses hold
# against half again their cost in the line unit of their tier.

[[scenario]]
id = "defense_t1_point_defenses_against_tanks"
title = "Immobile: three T1 point defenses against half again their cost in tanks"
target = "premiums.point_defense_holds_against_line_units"
blue_over_red = 1.5
shows = "A point defense cannot move, so it is worth more for its cost than the tank it stands in for. Three of them hold against half again their cost in Medium Tanks attack-moving in: the tanks are cut down before they break them."
try = "Attack-move in, then try spreading out and rushing one point defense from the side. They cost the most they can and still hold, so a few tanks more break them."
