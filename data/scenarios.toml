# Air at the ability price list's costs (2026-11-26): to try by hand, for the feel of what they buy.
# The Strategic Bomber costs about a third of what it did, the heavy gunship about half, the T3
# fighter and the fighter-bomber about half again more. These play no balance target.

[[scenario]]
id = "air_strategic_bombers_snipe_a_commander"
title = "A snipe: four Strategic Bombers against a commander and one SAM"
shows = "Four Strategic Bombers, about two and a half commanders' worth since the price list (nearly seven before), against a commander holding its ground with one SAM beside it. Four bombs destroy a commander, so if all four arrive together it falls in one pass, and their splash takes the SAM with it. The SAM gets only a few missiles off before they let go, not enough to bring one down."
try = "Order all four to attack the commander at once. Then send them in one at a time, and watch the SAM pick them off before the fourth bomb. Then go for the SAM first."
blue = [{ unit = "t3_strategic_bomber", count = 4, at = [700, 2_560], columns = 4 }]
red = [
    { unit = "command_rig", count = 1, at = [3_600, 2_560] },
    { unit = "t3_sam", cell = [176, 132] },
]

