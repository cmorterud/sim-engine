red = [{ unit = "t3_heavy_gunship", count = 7, at = [3_200, 2_560], columns = 7, order = "attack" }]

[[scenario]]
id = "air_fighter_bombers_against_interceptors"
title = "Two jobs: Fighter-bombers against interceptors over a tank column"
shows = "Four fighter-bombers against six interceptors coming at them, over a column of Medium Tanks. Since 2026-11-26 a fighter-bomber fights a plane as a fighter does, on its tail inside its gun's reach, rather than on bombing passes, and its gun destroys an interceptor in about two seconds. Then it carpets the tanks. That is why it costs half again more than it did."
try = "Attack-move at the tanks and let the interceptors come to you. Then order them onto the interceptors first, and onto the tanks once the sky is clear."
blue = [{ unit = "t2_fighter_bomber", count = 4, at = [1_200, 2_560], columns = 4 }]
