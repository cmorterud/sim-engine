[[scenario]]
id = "air_t3_fighters_against_heavy_gunships"
title = "Air superiority: T3 fighters against an equal cost of heavy gunships"
shows = "T3 fighters, which now cost more than heavy gunships, against an equal cost of them, coming at you. A T3 fighter destroys a heavy gunship in about 15 seconds on its own, and a gunship's own anti-air barely scratches it, so the fighters should win and keep most of themselves."
try = "Attack-move in. Then put all the fighters on one gunship at a time, and see how much quicker it goes."
