# Fights between domains (2026-11-24): each plays a `[domains]` cell of data/balance_targets.toml,
# named by `target`, at the counts the harness fights it with (`--balance-derive domains`), and on
# its ground. Mostly you play the side the target says should lose, to see whether it holds up
# against a player. Red's fleets hold where they are, as a fleet at anchor guarding its water.

[[scenario]]
id = "navy_t2_fleet_against_air"
title = "Navy against air: a T2 fleet against an equal cost of the T2 air force"
ground = "water"
target = "domains.cells.fleet_beats_air_force_t2"
shows = "A composed T2 fleet, destroyers, cruisers, and shield corvettes, against an equal cost of the air force the AI builds: interceptors, gunships, and fighter-bombers. The cruisers' anti-air bursts over massed aircraft, so the fleet wins clearly. The interceptors have nothing to fight here: that is part of what an air player pays for at sea."
try = "Attack-move in once. Then go for the cruisers first with everything, from one side, and keep the interceptors out of it."
blue = [
    { unit = "t1_interceptor", count = 24, at = [1_300, 2_560], columns = 8 },
    { unit = "t2_fighter_bomber", count = 16, at = [1_180, 2_560], columns = 8 },
    { unit = "t2_gunship", count = 32, at = [1_080, 2_560], columns = 8 },
]
red = [
    { unit = "t2_destroyer", count = 4, at = [3_000, 2_560], columns = 4 },
    { unit = "t2_escort_corvette", count = 2, at = [3_060, 2_560], columns = 2 },
    { unit = "t2_cruiser", count = 4, at = [3_120, 2_560], columns = 4 },
]

