    { unit = "t1_interceptor", count = 6, at = [3_000, 2_560], columns = 6, order = "attack" },
    { unit = "t1_medium_tank", count = 12, at = [3_400, 2_560], columns = 6 },
]

[[scenario]]
id = "air_heavy_gunships_against_a_t3_army"
title = "Gunships at half price: heavy gunships against a T3 army a fifth flak"
shows = "Eight heavy gunships, at about half what they cost before the price list, against as much of a T3 army: Heavy Walkers with a fifth of its cost in Mobile Flak, as the T2 anti-air rule has it. Gunships hover over what they attack, too slow to outfly flak, so the flak is the fight."
try = "Attack-move in. Then go for the flak first, from one side, and bring the rest in once it's down."
