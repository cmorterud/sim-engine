# far enough from the next that one missile's inner ring, which destroys any structure, takes only
# one: a full launcher flattens it if every missile lands. The defense stands in the middle group,
# and its reach covers every group, so it stops each missile on the way, one interceptor each.
# Red's structures all hold. The launcher fires once for each order: select it, press L (Launch),
# and click the ground, then again once it has reloaded. Since 2026-11-26 the defense fires an
