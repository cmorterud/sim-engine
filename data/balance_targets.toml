# Balance targets (BALANCE.md), draft 2, 2026-11-15.
#
# This game's own design intent, written as numbers the balance harness can check. The feel was
# set against the inspiration's ratios (time to kill, closing time, sight, tier efficiency), as
# PROVENANCE.md records, but no unit's values were taken from it. Everything in data/units.toml is
# to be derived from these, from the cost model, and from tuning runs.
#
# Scale, unchanged: 10 ticks a second, 20 map units to a terrain cell, speeds in map units a tick.

[decisions]
# The pace of the large-scale RTS this game succeeds, with fights a little longer.
pace = "like the inspiration, fights a little longer"
# Fights are decided by position and composition. Micro can win an edge in a pinch, such as
# against a larger force, but is never needed to play well: a touch less kiting than the
# inspiration, and dodging only by deliberate changes of direction.
micro = "light"
# Map scale, engine units, sight, and ranges stay as they are, so maps and the AI keep working.
scale = "keep"
# Every shell aims where its target will be when it arrives, artillery's too, so that steady
# movement never dodges and only a change of direction does. Artillery's long flight makes that
# worth far more against it. Bombs lead as well; shots at aircraft home. Cruise
# missiles neither lead nor follow, so that their long range is no help against what keeps moving.
leading_shots = "every shell"
# Bigger armies for the same income than the inspiration, at the same pace, since the engine can
# carry them: units are cheaper for their income, and tech costs scale with income, so that tech
# timings stay where [pace] puts them. Tuned with the other global knobs (BALANCE.md, step 5).
armies = "bigger, same pace"

# The unit everything else is measured against: the T1 Medium Tank, the plainest line unit.
[anchor]
unit = "t1_medium_tank"
materiel = 40
energy = 200
# At a T1 land factory alone.
build_seconds = 12
health = 420
# Damage a second, every shot landing: a tank kills a copy of itself in 14 seconds.
dps = 30
# Closing that range at its speed takes 4.9 seconds, 0.35 of the time to kill.
range = 350
# Crosses a 10 km map, 10,240 units, in about 142 seconds.
speed = 7.2
# Sight about 1.1 times range.
vision = 385
radius = 9
# The shell reaches full range in 0.55 seconds.
projectile_speed = 64

[ratios]
# Time to kill a copy of itself, health over damage a second, in seconds.
anchor_time_to_kill = 14
# Closing time (range over speed) over time to kill: what range is worth. Lower means less kiting.
closing_over_time_to_kill = 0.35
# Sight over range, by kind: scouts see far, line units a little past their guns, heavy units
# and artillery less than their range, so that they need spotting.
sight_over_range_scout_min = 1.5
sight_over_range_line = [1.0, 1.2]
sight_over_range_heavy = [0.85, 1.0]
sight_over_range_artillery = [0.5, 0.8]

# Time to kill a copy of itself, as a multiple of the anchor's, by role.
[roles]
raider = [0.3, 0.5]
scout = [0.3, 0.5]
line = [0.9, 1.1]
assault = [1.6, 2.2]
heavy = [1.6, 2.2]
artillery = [1.0, 1.3]

[economy]
# What energy is worth in materiel, for pricing units that spend more energy for their mass than
# land units do, aircraft above all, by the tier a fight is at. At T1, by what each costs to
# produce, one materiel of income costs about what five energy does (an extractor against a
# generator). From T2, fabricators turn about 100 energy into a materiel, and generators make
# energy ever cheaper, while extractors are held to their deposits: energy is worth about a
# hundredth of a materiel (2026-11-22). Valued at T1's rate in a T3 fight, a T3 fighter cost 21
# interceptors rather than 13, and interceptors spammed against it looked the better buy. Land
# units spend five energy for each materiel at every tier, and their prices are scaled to stay
# their mass, so this changes no land unit's price. Air keeps its heavy energy costs, as in the
# inspiration, where going air means building power; this only counts them.
# T4 (experimentals) at T3's (2026-11-27).
energy_per_materiel = [5, 100, 100, 100]
# What income is worth (2026-11-27, the design owner's plan): a tier's extractors and generators
# pay back what they cost, energy at the tier's rate, in about this many seconds of what they
# make, an upgraded extractor of what it adds (today T1's 54 and 56, T2's 238 and 264, the T3
# extractor's 410), so a unit's own income is priced at its tier's ([price_list]). T4 at T3's.
payback_seconds = [55, 250, 400, 400]
# Every extractor and generator costs its tier's payback of what it makes, an upgrade of what it
# adds, energy at the tier's rate (tests/payback_test.rs). These pay back in their own: the T3
# Power Generator keeps its cost (the design owner's pick, 2026-11-27; a 400-second payback would
# make it 10,000, from 3,816), and the soaks may revisit T3 energy's price; and the Geothermal
# Plant, whose vent is a map's resource, scarce, so it pays back fast.
payback_held = { power_generator_t3 = 153, geothermal_plant = 16 }
# Fabricators turn energy into materiel at their tier's rate (energy_per_materiel). Their costs are
# the design owner's: at the rate, they make nothing net.
# Build time stays each unit's own, an identity knob (the design owner's pick, 2026-11-27): land
# units take 6 seconds of build power a materiel, aircraft 2.0 to 6.5 and ships 3.4 to 4.9. One
# number a domain would have had the T1 Bomber build 75% slower and the Gunship 46% faster.
# One T1 extractor's income buys an anchor every this many seconds: cheaper units for their
# income than the inspiration's, for bigger armies.
t1_extractor_seconds_per_anchor = [17, 21]
# Tech costs (factory upgrades, T2 and T3 structures) scale with income, so the timings in [pace]
# hold.

[pace]
# Minutes, AI against AI of equal skill.
match_minutes_median = 30
match_minutes_range = [20, 40]
first_t2_minute = [7, 10]
first_t3_minute = [16, 22]
first_experimental_minute = [28, 38]
# Seconds for two equal-materiel armies of ten line units of a tier to fight to a finish.
fight_seconds_t1 = [25, 45]
fight_seconds_t2 = [30, 50]
fight_seconds_t3 = [35, 60]

[tiers]
# Each tier's line unit costs this much more than the last tier's.
cost_multiplier = [2.5, 3.5]
# And is about as strong per materiel (health times damage a second, square-rooted, per
# materiel): higher tiers win by range, toughness per frontage, and concentration, so lower tiers
# stay useful all game.
efficiency_multiplier = [1.0, 1.15]

[micro]
# A line weapon's shell reaches full range within this many seconds.
line_flight_seconds_max = 0.6
# Artillery shells take at least this long, so that a unit changing direction dodges them.
artillery_flight_seconds_min = 2.0
# With leading shots, the share of a line weapon's shots at full range that a target avoids by
# changing direction every second at full speed: by the target's weight class.
dodge_share_heavy_max = 0.05
dodge_share_line_max = 0.15
dodge_share_light_max = 0.35
# Within a tier, line units' ranges differ by no more than this share, so that kiting belongs to
# the roles built for it (skirmishers and artillery), not to every matchup.
line_range_spread_max = 0.10
# A skirmisher outranges what it counters by at least this share, and moves at least this share
# of its speed.
skirmisher_range_edge_min = 0.20
skirmisher_speed_share_min = 0.90
# The extra effective strength scripted micro (focus fire, pulling damaged units back) gives a
# force over plain attack-moving: worth it in a pinch, never decisive on its own.
micro_gain = [0.10, 0.25]

[siege]
# What artillery is for, past the field: breaking defended positions. It outranges the point
# defenses of its tier by at least this share, so that it can shell them without reply, and an
# equal materiel of it breaks a position of them under a dome of its tier within this many
# seconds, losing nothing. Its price comes from the field, as at T1: a position it outranges
# cannot fight back, so any strength breaks it in time, and pricing to a siege time made it too
# weak to hold the field (2026-11-21). Pricing T3 artillery by a field duel alone, before, cut its
# reach below the T2 point defense's.
outrange_defense_min = 0.15
seconds_max = 60

[premiums]
# A unit pays in strength per cost for what it can do that its counterpart cannot, and is made up
# for what it cannot do (2026-11-25, the user's rule, everywhere): a defense that cannot move is
# worth more for its cost than the mobile unit it stands in for, and a unit that crosses water is
# worth less on land than one that cannot.
#
# Immobile: three point defenses of a tier hold against this many times their cost in that tier's
# line unit attack-moving into them. The line unit trades evenly with itself, so this is the
# premium. Measured as a fight, since a point defense's reach, which strength per cost leaves out,
# is most of what it has over the line: by that measure alone the T2 one is a third the Heavy
# Tank's, yet holds against twice its cost of them. Raised by damage at T3, where health would
# slow the sieges `[siege]` and `[domains]` time, and by both at T1, which no siege measures.
point_defense_holds_against_line_units = 1.5
# Immobile: static anti-air's strength per cost against aircraft, √(anti-air damage a second ×
# health) / cost, over the mobile anti-air of its tier's (T1 and T2; T3 has no mobile anti-air).
# Measured by strength, since a mobile group is judged even and a position broken, which do not
# compare as fights. Both were near 0.6 before, here and in the inspiration.
static_anti_air_over_mobile = [1.5, 2.0]
# Amphibious: the hovercraft's strength per materiel over the Heavy Tank's on land, by break-even:
# it pays for crossing water, as the inspiration's does, about three-quarters as strong for its
# cost by the inspiration's ratios (0.71 against its line's 0.96). It was about even until today.
hovercraft_over_heavy_tank_on_land = [0.65, 0.85]

[missiles]
# Missile launchers do artillery's job, breaking positions from beyond their guns, but artillery
# is the better unit: missiles fly to where their target was, so they miss anything that keeps
# moving, and missile defense shoots them down. So a launcher is priced as T1 artillery is, at
# this share of its strength per materiel, rather than by a duel against it, which had every
# change to T1 artillery move its price (2026-11-21, when artillery took to lobbing its shells).
# Less than one, though its drawbacks first suggested more: its reach, more than twice T1
# artillery's, outranges point defenses, which is worth more than they cost it. At 1.2, line
# units walking into launchers came out even; at this, they win, and T1 artillery beats them.
# As a check, an equal materiel of launchers breaks a shield over three T2 point defenses, which
# they outrange, within this many seconds, losing nothing. Its length cannot price them: twelve
# launchers break it in a few volleys, so their reload sets it, at every strength tried.
strength_over_artillery = 0.8
siege_seconds_max = 60
# Game-ending weapons have no fight to price them (2026-11-27). Tech costs scale with income
# ([economy]), so they are priced in minutes of a standard T3 economy: this many T3 extractors'
# income, 144 a second, at T3 prices. Today's costs, written down as the design owner's numbers;
# the step 5 soaks may move them against [pace].
t3_economy_extractors = 8
strategic_minutes = { strategic_missile = 2.98, strategic_missile_launcher = 2.27, strategic_interceptor = 0.79 }
# A missile defense costs a share of the missile it stops, today's: an interceptor about a quarter
# of a strategic missile; a Tactical Missile Defense about one tactical missile.
defense_over_missile = { strategic_interceptor = 0.267, tactical_missile_defense = 1.09 }

[splash]
# Formations keep units 2.5 radii apart, center to center (FORMATION_SPACING_RADII). A blast's
# reach is its splash plus its target's radius, measured here in those spacings against the line
# unit of the weapon's own tier (radius 9 at T1, 11 at T2, 13 at T3), so it says how many units
# in a tight formation one hit catches: within one spacing, a unit and its four neighbours; within
# about one and a half, the three by three block round it; within about three, the 29 inside.
# Line weapons splash no wider than their target's radius, so it is incidental.
line_splash_over_target_radius_max = 1.0
# Three sizes, by what the weapon is for (2026-11-21, to play as the inspiration does: its heavy
# artillery and strategic bombers are known for wrecking whole clumps). Narrow, about 5 units: T1
# artillery, grenadiers, the commander's Discharge. One size for every splash weapon, as first
# written, had narrowed the heavy ones until they barely felt heavy.
splash_reach_over_spacing = [1.0, 1.2]
narrow = ["t1_light_artillery", "t2_grenadier_walker"]
# Medium, about 9: tactical bombers, whose runs drop a spread of bombs.
medium_reach_over_spacing = [1.45, 1.95]
medium = ["t1_bomber", "t2_fighter_bomber"]
# Wide, about 29: heavy artillery and strategic bombers, devastating against a clump and a base,
# much less so against units spread out, which is the answer to them.
wide_reach_over_spacing = [2.85, 3.15]
wide = ["t2_artillery", "t3_artillery", "t3_mobile_artillery", "t3_strategic_bomber"]

[kills]
# Hits to destroy a unit at its base health, with no veterancy or enhancements: exact counts, so
# that a unit is neither tougher nor weaker against these weapons than designed (2026-11-21).
# A personal shield counts with the health it guards. These set damage and health where the duels
# cannot: the strategic bomber is the T3 snipe weapon, fast, with one great bomb a pass, countered
# by T3 fighters and SAMs; the tactical missile launcher snipes too, countered by missile defense.
# The commander, tough against everything else, falls only to these.
t1_bomber = { t1_medium_tank = 2, t1_mobile_aa = 2 }
t3_strategic_bomber = { t3_heavy_walker = 1, t3_siege_walker = 3, t3_mobile_artillery = 1, t2_artillery = 2, command_rig = 4 }
tactical_missile_launcher = { field_rig = 2, command_rig = 2 }
# The T3 SAM: two missiles bring down a Gunship, and eight a Strategic Bomber (2026-11-25), which
# [kill_times] times.
t3_sam = { t2_gunship = 2, t3_strategic_bomber = 8 }
# Mobile Heavy Artillery is a glass cannon: it survives one shell from another of its kind, but not
# two, and one shell kills a Medium Tank. Its shell keeps the damage the arcs pass gave it, 859, and
# its spread, 60, makes it inaccurate, as heavy artillery is in the inspiration, so that it is for
# clumps and positions rather than picking off single units. Priced by the walk-in duel, with its
# blast wide, it wiped out Heavy Walkers at the lowest strength the search allows. Since 2026-11-24
# it fires about half as often, to sit under the battleship's turrets, and a swarm of Medium Tanks
# of its cost overruns it; it is not asked to win that fight.
t3_mobile_artillery = { t3_mobile_artillery = 2, t1_medium_tank = 1 }
# The T3 Artillery Installation destroys any T3 land unit with a direct hit, but its spread is
# wide, so it is for base-sized targets; the T2 one, with a moderate spread, for small bases.
t3_artillery_kills_every_t3_land_unit = true
t3_artillery_spread = [150, 200]
t2_artillery_spread = [40, 60]

[volleys]
# Volleys of a unit's anti-air, all its shots at one aircraft, to destroy each aircraft at its base
# health, with no veterancy (2026-11-25, the design owner's numbers;
# reports/plans/2026-11-25-weapons-nukes-shields.md). The cruiser's, a volley every two seconds:
# one for every T1 aircraft, the Torpedo Bomber and the Gunship; two, in under four seconds, for
# the Fighter-Bomber, the Spy Plane and the Air Transport; three for the T3 fighter; four for the
# Strategic Bomber; six, in under twelve seconds, for the Heavy Gunship. The Gunship's and the
# Strategic Bomber's health were set by it, the bomber a little over four Gunships'.
t2_cruiser = { t1_air_scout = 1, t1_interceptor = 1, t1_bomber = 1, t1_light_transport = 1, t2_torpedo_bomber = 1, t2_gunship = 1, t2_fighter_bomber = 2, t3_spy_plane = 2, t2_transport = 2, t3_air_superiority = 3, t3_strategic_bomber = 4, t3_heavy_gunship = 6 }

[broadsides]
# Broadsides of a battleship, every shell of the volley landing, to destroy each target at its base
# health, with no veterancy (2026-11-25, the design owner's numbers): a T3 extractor in one, and a
# commander with no enhancements in two. And one takes down a T2 Shield Generator's dome, exactly:
# the dome falls to the volley's last shell, and not before (tests/kill_times_test.rs).
t3_battleship = { mass_extractor_t3 = 1, command_rig = 2 }

[kill_times]
# Seconds for these attackers, alone, to destroy one target that holds still and does not fire
# back, timed from the first shot (2026-11-25, the design owner's numbers): a commander with no
# enhancements, on land or walking the seabed; a submerged T1 Attack Submarine; and aircraft
# hanging in the air. Each is "about" its number: a reload's width either side.
cruiser_missiles_commander_on_land = [95, 105]
destroyer_guns_commander_on_land = [75, 85]
five_destroyers_torpedoes_commander_under_water = [75, 85]
destroyer_torpedoes_t1_sub_submerged = [22, 28]
two_torpedo_boats_commander_under_water = [55, 65]
# Six T1 Attack Submarines, about a destroyer's cost, attack-moving onto one, sink it in about 39
# seconds (33 until 2026-11-26, when the destroyer took the navy line's health and the
# submarine's health was kept, the design owner's pick). Timed from the first shot to the
# destroyer's sinking, by tests/kill_times_test.rs.
six_t1_subs_sink_a_destroyer = [34, 44]
# A battleship's two broadsides destroy a commander on land in about 16 seconds: they are 13.5
# seconds apart, which [model] sets (2026-11-26; 16 until then). The design owner's 26,
# then anything up to 40 (2026-11-25).
battleship_commander_on_land = [15, 40]
# One battleship breaks an unassisted T3 Heavy Shield Generator's dome in about 45 seconds from
# its first damage, a broadside every 13.5 that the dome cannot heal in time; the broadside that
# breaks it destroys the generator (2026-11-25).
battleship_breaks_t3_shield = [40, 52]
# The frigate against T1 bombers (2026-11-26, the design owner's rule, in place of an equal-cost
# fight that held its cost): its anti-air destroys one in about 21 seconds, and six of them sink it
# in two passes and lose none. They set its anti-air (23.8 a second against a bomber's 500) and
# check its health (between six bombs and twelve); its cost is then the price list's.
frigate_anti_air_t1_bomber = [20, 22]
six_t1_bombers_sink_a_frigate_passes = 2
# Mobile Anti-Air against the T1 Bomber (2026-11-27, the design owner's rule): one destroys one
# hanging in the air in about 24 seconds, as it did before. It sets Mobile Anti-Air's gun (a
# bomber's 500 over 24 seconds, 20.8 a second), and through [air] anti_air_escort_share the T1
# Bomber's cost and the T1 air base ([price_list] domain_base).
mobile_aa_t1_bomber = [23, 25]
# Air against air and the commander (2026-11-26, the design owner's rules): they set the T3
# fighter's gun (1,070 a shot every second, in a 40-degree cone) and health (3,520), the heavy gunship's health (9,600, also the cruiser's six volleys) and gun (360
# a second), and the fighter-bomber's anti-air (174 a second). Timed from the first shot, which
# lands at once, so health is set at half a shot past the time. The Strategic Bomber has no anti-air.
# With its gun in a 40-degree cone (2026-11-26) it lands a shot about every 2 seconds, so its
# kill times step by 2 seconds; the design owner took 1,070 damage, which puts a Strategic Bomber
# down in 8.7 s (6 shots), and the band's low end with it.
t3_fighter_strategic_bomber = [8.5, 11]
t3_fighter_t3_fighter = [4.5, 5.5]
t3_fighter_heavy_gunship = [14, 16]
heavy_gunship_commander_on_land = [45, 55]
fighter_bomber_interceptor = [1.5, 2.5]
sam_t2_gunship = [1.5, 3.0]
sam_t3_strategic_bomber = [9.5, 12.5]
# The T2 Flak Cannon against air transports hanging in the air (2026-11-27, the design owner's
# numbers): it destroys a Light Air Transport in about 4 seconds, an Air Transport in about 11, and
# a Heavy Air Transport, through its shield and the shield's regeneration, in about 55. They set
# the transports' health, in the middle of the health that takes that many shells.
flak_t1_light_transport = [3.2, 4.8]
flak_t2_transport = [10.2, 11.8]
flak_t3_heavy_transport = [54.2, 55.8]
# The cruiser's anti-air, its volleys timed by tests/kill_times_test.rs.
cruiser_two_volleys_seconds_max = 4
cruiser_six_volleys_seconds_max = 12

[commander]
# The Command Rig's gun (2026-11-27, the design owner's plan): holding its ground, it comes out
# ahead of this many Medium Tanks attack-moving into it, and behind two more. Its damage is the
# least that does: a Medium Tank in six shots, 70 (at seven shots, 60, it loses to them; measured
# again, 69.9 loses). Its reach, 1.26 times the tank's, and its reload are the design owner's.
holds_against_medium_tanks = 16
# Discharge destroys any T1 land unit in one: its least damage is at least the toughest one's
# health (the T1 Mobile Anti-Air's, 615). Its 1,250, its store and its scaling are the design
# owner's.
discharge_kills_every_t1_land_unit = true

[air]
# Air against land (2026-11-21). T1 air is set by these rules and [kills], one number each, not by
# a strength solved for: anti-air is a hard counter, and bombers punish what has none.
# A T1 tank takes two bombs ([kills]), one bomber's two passes or two bombers' one, and five T1
# bombers destroy a lone commander, holding its ground, in about a minute (79 s accepted,
# 2026-11-22: bombers keep a straight run at their target, however tight their turn, so that
# none skips a pass). The commander's health is set by the
# snipe rules ([kills]), so the bomb is as big as the tank's two allows: the tank has this many
# bombs' worth of health, just over one.
line_health_over_bomb = 1.025
commander_seconds_five_bombers_t1 = [55, 85]
# Mobile Anti-Air takes two bombs ([kills]): this many bombs' worth of health, in the middle of
# that. It has the anchor's health per mass, so that it is no cheaper a shield than a tank.
anti_air_health_over_bomb = 1.5
# One interceptor on a bomber's tail destroys it in about this long: what sets a bomber's health.
interceptor_seconds_per_bomber_t1 = 10
# An equal cost of Interceptors clears an equal cost of T1 Bombers, check_materiel a side, in
# about the time it takes (2026-11-27, the design owner's rule, at what it measured: 8.9 s, and
# 10.3 s once guns fired only when laid on their target): the Interceptor's size,
# √(health × damage a second), which every T1 air number above scales with. Its health over its
# damage a second is the [model] time to kill in air-to-air fights. With the T1 air base pricing
# the Bomber at its cost (0.294), the Interceptor costs 8% more and they take 11.2 s: the design
# owner kept its size and took the dearer Interceptor (2026-11-27; 9 to 11 s until then). With
# every sensor over the base (0.315), it costs 164.
interceptors_clear_bombers_seconds = [9, 12]
# A land army this share anti-air, by materiel, comes out about even with an equal materiel of
# bombers ([counters] even_margin): what sets the T1 Bomber's cost, with Mobile Anti-Air's gun set
# by [kill_times] mobile_aa_t1_bomber (2026-11-27; until then this set the gun, against a bomber
# cost taken from the inspiration).
anti_air_escort_share = 0.2
# At T2 (2026-11-27, the design owner's pick), the tier's standard land army, about a third
# anti-air by materiel, as the AI's T2 army has been measured since 2026-11-24, and an equal cost
# of the tier's strike aircraft (the price list's T2 air force without its fighters, at the T2 air
# base) break even, by efficiency within escort_efficiency, the mean over armies of
# escort_squadrons squadrons (two to four tier fights' worth, [pace]), each unit in its own block,
# the shortest reach in front and the anti-air behind. What sets the Mobile Flak's gun
# (balance::derive_t2_flak, `--balance-derive air-bases`). T3's is measured in the battle line
# instead ([battle_line] t3_air): measured this way, against a fifth flak, the answer turned on
# which units made up the rest of the army and in what order they marched (Heavy Gunships 0.94 to
# 1.66 times the better buy, 2026-11-27).
escort_forces = { t2 = ["t2_land_army", "t2_strike_aircraft"] }
escort_squadrons = { t2 = [3, 6] }
escort_efficiency = [0.85, 1.15]
# Checks. Bombers destroy an equal materiel with no anti-air within a tier fight's time ([pace]),
# at a tier fight's size, ten anchors a side: bigger groups of bombers take longer, as more of
# their bombs fall on the same targets. Pure anti-air keeps at least this share against an equal materiel of bombers.
# The strike is measured, not held: T1 bombers clear ten undefended Medium Tanks in about 22
# seconds, as T2 gunships clear ten Heavy Tanks (2026-11-27), a little under this.
strike_seconds_t1 = [25, 45]
anti_air_keeps_min = 0.7
# The materiel a side for these fights, enough that a fifth of it is several anti-air.
check_materiel = 3000

# Fighters out-turn what they hunt, by at least this multiple of the T1 bomber's turn rate, so that
# a bomber cannot shake one off its tail (2026-11-22).
fighter_turn_over_t1_bomber = 1.5
fighters = ["t1_interceptor", "t2_fighter_bomber", "t3_air_superiority"]

# The T3 fighter against the T1 interceptor (2026-11-22), so that teching up is worth it: about
# this many times its damage a second; a shot that destroys one; a little more range and speed;
# and a turn this many times as quick. Its guns, unlike the interceptor's, fire off its nose, so
# that it can take on a swarm. In a fight at T3 prices ([economy]), it beats an equal materiel of
# interceptors by at least this score.
[air.t3_fighter]
# Its damage a second is set by [kill_times] (2026-11-26; nine to eleven times the interceptor's
# until then). It is 30% faster than the Strategic Bomber.
speed_over_strategic_bomber = 1.3
range_over_interceptor = [1.05, 1.25]
turn_over_interceptor = 1.25

# Flying heights, as shares of the T3 spy plane's, the highest (2026-11-22): the spy plane far up,
# fighters and the heavy bombers below it, light aircraft lower, and what hovers lowest.
[air.heights]
t3_air_superiority = 0.8
t2_fighter_bomber = 0.8
t3_strategic_bomber = 0.8
t2_gunship = 0.45
t3_heavy_gunship = 0.45
t1_light_transport = 0.45
t2_transport = 0.45
t3_heavy_transport = 0.45
t1_air_scout = 0.7
t1_bomber = 0.6
t1_interceptor = 0.6

[counters]
# In an equal-materiel fight, the share of its army a designed winner keeps.
winner_survivors = [0.40, 0.70]
# A matchup meant to be even ends within this margin of surviving shares.
even_margin = 0.15
# One that depends on micro, within this.
micro_margin = 0.25
# Matchups meant to turn on micro, where it is worth far more than [micro] micro_gain: massed line
# units, assault units, or raiders against massed artillery lose attack-moving and win spread out
# and charging. Micro flips them: attack-moving, the artillery keeps at least this share; with
# micro, the other side does. (As an efficiency ratio, the gain ran to thousands of percent,
# since attack-moving into artillery is worth next to nothing.)
micro_cells = [["line", "artillery"], ["assault", "artillery"]]
micro_cell_flip_min = 0.3
# Artillery always has counters that need no micro: other artillery, mobile shields, heavy units
# that walk through its fire, and bombers. Raiders were one, until artillery lobbed its shells
# down on what it aims at (2026-11-21): a few small units charging it from the front now die on
# the way, which is right, and raiders are for artillery left alone and caught close.
artillery_counters_without_micro = ["artillery", "mobile_shield", "heavy", "bomber"]
# Counters are priced by the duel they win (the design owner's call, 2026-11-26), solved in code
# (balance::derive_counters, 2026-11-27). The Torpedo Boat costs the most it can and still keep
# the top of winner_survivors against an equal cost of submarines, as the mean score over fleets of
# these many squadrons of it: one size alone turns on how the submarines round, a step of a tenth
# of the boat's cost. The Torpedo Bomber costs the least that keeps torpedo bombers needing twice
# the T2 fleet's cost to break it ([domains.cells] torpedo_bombers_to_break_fleet_t2), and twice the
# massed T3 fleet's (torpedo_bombers_to_break_fleet_t3, since its bomber's runs, 2026-11-27).
counter_squadrons = [4, 5, 6, 7]

[strategy]
# AI strategy variants (T2 rush, T1 spam, air-heavy, naval-heavy) each win within their timing
# windows and lose outside them, and none wins more than this share over all.
win_rate_max = 0.55
# Mirror matches stay fair: Blue's share of wins, by the soak's binomial test.
mirror_p_min = 0.05
# After 15 minutes, T1 units are still at least this share of units built: they stay useful.
t1_share_after_15_min = 0.15

[domains]
# Between domains: land, air, navy, and the hovercraft that crosses from one to the other
# (2026-11-24). Each domain is strongest in its own medium, and the map decides how much of each
# medium there is. This is not "equal cost comes out even everywhere": navy rules open water and is
# held back by where water reaches; air is weaker per cost against a proper fleet, and its strength
# is reach, striking anything, anywhere. A map that is mostly ocean should favor navy, and one
# with little water leaves it a side show.
#
# At sea, with equal resources, navy against air: a massed, mixed fleet (battleships,
# battlecruisers, cruisers, destroyers, shield ships) is all but impenetrable from the air,
# torpedo bombers included, as it plays in the inspiration (the designer's experience of it,
# 2026-11-24). Its answers are another fleet, submarines against a fleet with no anti-submarine
# weapon, torpedo launchers at a coast, and strategic missiles; massed T3 submarine hunters and
# massed T3 torpedo defenses, which are not in the game yet, would be more. The inspiration's static
# ratios put torpedo bombers at about 0.6 to 0.7 times a fleet's cost to break it, but they leave
# out what keeps a fleet alive in play: torpedo defense, anti-air splash on massed aircraft, and
# shields. The fights below follow the play.
#
# The numbers lean on the inspiration's ratios, for feel, as [decisions] does: each role's strength
# per cost against its own T1 line unit, the median across its factions
# (reports/balance/2026-11-24-inspiration-ratios.md). No unit's values come from it.

# A role's strength per cost, √(damage a second × health) over its cost at its tier, by the damage
# the role is for (anti-air for fighters, torpedoes for submarines and torpedo bombers, guns and
# missiles for the rest), as a multiple of the anchor's: the inspiration's ratios for the roles not
# yet derived. Each is to come within `strength_band` of its ratio.
strength_band = [0.80, 1.25]

[domains.strength_over_anchor]
# The navy's by the ability price list's costs (2026-11-26, [price_list]): the submarine, destroyer,
# cruiser, battleship and battlecruiser are their strength per cost at those costs, measured again
# at the navy base from the battle line (2026-11-27).
t1_frigate = 0.44
t1_attack_sub = 0.25
t1_torpedo_launcher = 0.45
t2_torpedo_launcher = 0.64
t2_destroyer = 0.36
t2_cruiser = 0.24
t2_torpedo_boat = 0.32
t3_battleship = 0.54
# The battlecruiser by the ability price list (2026-11-26), not the inspiration's 0.25: its
# lasers at twice a battleship turret's damage a second, its cost paying for lasers that cannot
# be dodged (reports/plans/2026-11-26-derived-stats.md).
t3_battlecruiser = 0.45
# T2 and T3 aircraft by the ability price list's costs (2026-11-26, [price_list]): their strength
# per cost at those costs, their stats set by [kill_times] and [volleys]; T3's measured again at
# the T3 air base from the battle line (2026-11-27).
t2_gunship = 0.93
# The torpedo bomber is a counter, its cost held by its cells (2026-11-26): this is its strength per
# cost at 240, the price list's 131 only a check; 0.92 at 132 once it flew a bomber's runs and let
# its torpedoes go along its heading (the design owner, 2026-11-27).
t2_torpedo_bomber = 0.92
t2_fighter_bomber = 0.31
t3_heavy_gunship = 0.98
t3_air_superiority = 0.88
# The interceptor by the ability price list at the T1 air base (2026-11-27, [price_list]
# domain_base): its strength per cost at 175 (0.33 at 162, until the base priced the Bomber).
t1_interceptor = 0.31
# The mobile flak is not here: like the T1 mobile anti-air, it is set by the anti-air share rule
# ([air] escort_forces), not by a ratio.

# Standard forces, by how many of each a squadron has, bought by whole squadrons to the materiel of
# a fight. The fleets are what a player fields: a T2 fleet is two destroyers, a couple of cruisers
# for anti-air and missile defense, and an escort corvette's shield (the example the design was
# decided on). The air forces are what the AI's air factories make: a third fighters, the rest
# strike aircraft, every fourth at T2 a fighter-bomber. A massed T3 fleet's escorts are
# seven-tenths of its cost (2026-11-24): they carry its anti-air and its anti-torpedo charges, as in the
# inspiration, whose battleships have next to no anti-air and no anti-torpedo charge, so a fleet
# is as safe from the air as it is escorted. The AI's T3 naval factories build this mix.
[domains.forces]
t1_fleet = { t1_frigate = 3, t1_attack_sub = 1 }
t2_fleet = { t2_destroyer = 2, t2_cruiser = 2, t2_escort_corvette = 1 }
t2_fleet_without_anti_air = { t2_destroyer = 2 }
t2_fleet_without_anti_submarine = { t2_cruiser = 2, t2_escort_corvette = 1 }
t3_fleet = { t3_battleship = 1, t3_battlecruiser = 1, t2_cruiser = 12, t2_destroyer = 4, t2_escort_corvette = 4 }
# One of each, as the AI's T3 naval factories built until 2026-11-24: capital ships three-quarters
# of its cost, lightly escorted.
t3_battleship_heavy_fleet = { t3_battleship = 1, t3_battlecruiser = 1, t2_cruiser = 1, t2_destroyer = 1, t2_escort_corvette = 1 }
t1_air_force = { t1_interceptor = 1, t1_bomber = 2 }
t2_air_force = { t1_interceptor = 3, t2_gunship = 4, t2_fighter_bomber = 2 }
t3_air_force = { t3_air_superiority = 3, t3_heavy_gunship = 4 }
t2_torpedo_bombers = { t2_torpedo_bomber = 1 }
t1_submarines = { t1_attack_sub = 1 }
t2_destroyers = { t2_destroyer = 1 }
t2_torpedo_boats = { t2_torpedo_boat = 1 }
t1_frigates = { t1_frigate = 1 }
t1_bombers = { t1_bomber = 1 }
t2_hovercraft = { t2_assault_hovercraft = 1 }
t2_heavy_tanks = { t2_heavy_tank = 1 }
# The standard T2 land army: about a third anti-air by materiel (two Mobile Flak, 320 of 884). It
# was labelled a fifth from 2026-11-24 to 2026-11-27, which it never was; the design owner kept it
# as it is ([air] escort_forces).
t2_land_army = { t2_heavy_tank = 2, t2_grenadier_walker = 1, t2_mobile_missile_launcher = 1, t2_mobile_flak = 2 }
# The T2 air force's strike aircraft, which hold the T2 air base ([price_list] domain_base).
t2_strike_aircraft = { t2_gunship = 4, t2_fighter_bomber = 2 }
# The standard T3 land army (2026-11-27): what the AI's T3 land factories build in turn
# (data/ai_strategies.toml, Balanced: two Heavy Walkers, the Mobile Artillery, the Siege Walker, a
# Heavy Tank and a Mobile Shield), and a fifth of it anti-air by cost, as at T1 (the design
# owner's pick): four Mobile Flak, 640 of 3,018.
t3_land_army = { t3_heavy_walker = 2, t3_mobile_artillery = 1, t3_siege_walker = 1, t2_heavy_tank = 1, t2_mobile_shield = 1, t2_mobile_flak = 4 }
# The T3 air force's strike aircraft.
t3_strike_aircraft = { t3_heavy_gunship = 1 }

[domains.cells]
# Each a fight at equal cost unless it says otherwise, scored as [counters] scores it: the first
# force's share of its materiel left, less the second's, from -1 to 1. A designed winner keeps
# [counters] winner_survivors, so it scores at least the lower end; even is within even_margin.
#
# A composed fleet rules the water: it beats an equal cost of the air force over the sea, and a
# massed T3 fleet keeps most of itself.
fleet_beats_air_force_t2 = 0.40
fleet_beats_air_force_t3 = 0.60
# And it takes overwhelming torpedo bombers, this many times the fleet's cost, to break it: the
# break-even's efficiency of the fleet against them. At least twice, for a T2 fleet and a massed,
# escorted T3 one (three times for T3 until 2026-11-24, when the escorts were chosen to carry it,
# as in the inspiration). The upper ends only keep a wing of torpedo bombers from being worthless.
torpedo_bombers_to_break_fleet_t2 = [2.0, 5.0]
torpedo_bombers_to_break_fleet_t3 = [2.0, 5.0]
# And capital ships without their escorts are torpedo bombers' prey: a battleship-heavy fleet
# breaks to at most its own cost of them. That is the counterplay to skimping on escorts.
battleship_heavy_fleet_breaks_to_torpedo_bombers_at_most = 1.0
# The frigate against T1 bombers is set by [kill_times] (2026-11-26): one bomber in about 21
# seconds, six sink it in two passes. An equal cost of them, which held it here until then, is
# shown by the balance report, not held.
# The sub hunter is a hard counter (2026-11-26): Torpedo Boats beat an equal cost of submarines,
# keeping at least [counters] winner_survivors. The ability price list averages a unit over an
# enemy mix, half ships and half submarines, which undervalues a counter, so the duel holds the
# Torpedo Boat's cost against the list's (the design owner's call, 2026-11-26): 819, and 794 from
# 2026-11-27, solved at the top of winner_survivors ([counters] counter_squadrons); 748 with the
# submarines at the navy base from the battle line. This is its floor.
torpedo_boats_beat_submarines = 0.40
# Skipping the counter loses. A fleet with no anti-air loses to torpedo bombers; one with no
# anti-submarine weapon loses to submarines. And submarines beat an equal cost of destroyers
# alone: the destroyer hunts one submarine at a time, in about 25 seconds, while six of them sink
# it in about 33 ([kill_times], the design owner's numbers, 2026-11-25). Until then destroyers
# were to beat submarines, with an anti-torpedo charge every second; it is back to the
# inspiration's every 10 seconds. Destroyers keep a fleet's submarines off it as part of the fleet,
# under its fire.
fleet_without_anti_air_loses_to_torpedo_bombers = -0.40
submarines_beat_fleet_without_anti_submarine = 0.40
submarines_beat_destroyers = 0.40
# Air against the standard T2 land army is [air] escort_forces (2026-11-27; until then the T2 air
# force, fighters and all, about even with it by an equal-cost score).
# The hovercraft loses clearly to an equal cost of a fleet on the water. Its strength on land is
# in [premiums], with the other capabilities a unit pays for.
hovercraft_loses_to_fleet = -0.40
# Ships break coastal bases from T2 up: these outrange the point defense of their tier by at least
# [siege] outrange_defense_min, and coastal_ship_count of them break a coastal position of that
# tier within coastal_seconds_max, losing at most coastal_losses_max. Slower than artillery's
# [siege] seconds_max, which is for guns that take fire while they shell: ships shell from beyond
# the defenses' reach and lose nothing, so their pace is all that is left to set (2026-11-24).
# Two ships, not an equal cost, since 2026-11-25: the T2 dome heals as fast as one cruiser's
# missiles strike it, so one cruiser never breaks the position by design
# (reports/plans/2026-11-25-weapons-nukes-shields.md, item 3), and whole ships at an equal cost
# come to one. One battleship does break the T3 one, in about 45 seconds of its dome ([kill_times]).
coastal_ships = { t2_cruiser = "t2_point_defense", t3_battleship = "t3_heavy_point_defense" }
coastal_ship_count = 2
coastal_seconds_max = 120
coastal_losses_max = 0.10
# A battleship outranges a T2 Artillery Installation by battleship_over_t2_artillery_reach (its
# guns' reach over the artillery's), and parked between the two reaches it destroys a T2
# artillery position, a Shield Generator's dome over four installations, within
# battleship_breaks_shielded_t2_artillery seconds of its first damage, as [siege] times a siege,
# with never a shot fired at it. Its first volley takes the dome down, and no less does: a volley
# does what the dome absorbs before it goes down (the design owner's numbers, 2026-11-25). How
# long it takes depends on how close the installations stand, which its shells' blasts reach
# across: from about 17 seconds packed in a square to about 65 spread out. The measure has two
# side by side against the generator's seaward side, one off its north side, and one behind it.
battleship_over_t2_artillery_reach = [1.28, 1.32]
battleship_breaks_shielded_t2_artillery = [40, 50]
# Torpedo launchers and a counter-fleet are the answer: an equal cost of destroyers closing on
# torpedo launchers does not break them; and at T1, frigates closing on T1 torpedo launchers.
destroyers_break_torpedo_launchers = false
frigates_break_t1_torpedo_launchers = false

[battle_line]
# The battle line (2026-11-27, the design owner's pick; balance::battle_line_fight): a force
# standing in fixed ranks, by rule (balance::battle_rank): direct fire in front, the shortest
# reach first; anti-air, and shields without a gun, in the middle; artillery and guns that lob
# behind. An equal cost of aircraft comes at it from the front, a flank, and the rear, each from
# four starting layouts and with the teams each way round, and the fight is measured at four
# sizes. Where an army stood decided much of what aircraft did to it (Heavy Gunships 0.94 to 1.66
# times the better buy by march order alone), so the ranks are set by rule and the approaches
# averaged over. A standing army does worse against aircraft than one marching with its anti-air
# behind: the T2 strike aircraft are 1.35 times the better buy against the T2 army here, where
# the escort rule ([air]) has them even on the march.
squadrons = { t2_land_army = [3, 6], t3_land_army = [2, 5], t2_fleet = [2, 5], t3_fleet = [1, 2] }
# The T3 air base ([price_list] domain_base air_t3): the T3 strike aircraft against the standard
# T3 army as good a buy as the T2 strike aircraft against the standard T2 army
# (balance::derive_t3_air_base).
t3_air = ["t3_land_army", "t3_strike_aircraft"]
t3_air_as = ["t2_land_army", "t2_strike_aircraft"]
# The navy base ([price_list] domain_base navy): the T2 fleet, in its battle line at sea, scores
# this against an equal cost of the T2 air force (the design owner's target, 2026-11-27, at about
# what it scored then; balance::derive_navy_base). The T3 fleet against the T3 air force is a
# check, [domains.cells] fleet_beats_air_force_t3.
navy = ["t2_fleet", "t2_air_force"]
navy_t3 = ["t3_fleet", "t3_air_force"]
navy_score = 0.6

[model]
# The model every stat not pinned above is derived from (2026-11-26, the design owner's rule: no
# number borrowed or fitted, and no exceptions). reports/plans/2026-11-26-derived-stats.md works
# each unit through it.
#
# Time to kill, health over damage a second, between equal groups of the same unit:
# base x tier x domain x role.
time_to_kill_base_seconds = 14
# T4 continues the steps, 1.45 (2026-11-27), for experimentals; no unit is T4 yet.
time_to_kill_tier = [1.0, 1.15, 1.3, 1.45]
time_to_kill_domain = { land = 1.0, navy = 3.0, air_to_air = 0.65 }
# Roles, as a factor on the line's time to kill and its closing share. The destroyer is the navy
# line, measured on its guns, its torpedo a sub-hunting ability; the frigate a brawler; the
# torpedo boat the sub hunter archetype; the cruiser and the escort corvette support. Gun
# artillery takes the Light Artillery's factor (2026-11-27), the missile launcher the line's.
role_time_to_kill = { line = 1.0, sub_hunter = 0.4, artillery = 1.15 }
# Reach: closing share x speed x time to kill. Navy closes at 0.57 of land's share.
# T4 0.48: T2 to T3 added only 0.03 (2026-11-27).
closing_share_land = [0.35, 0.44, 0.47, 0.48]
closing_share_navy_over_land = 0.57
closing_share_role = { brawler = 0.12, sub_hunter = 0.35 }
# Base speeds: land, and navy at about 85 seconds to cross 10 km.
speed_land = 72
speed_navy = 120.5
# Strength split while costs wait for the ability price list: health = S x sqrt(T), damage a
# second = S / sqrt(T), with S = sqrt(health x damage a second) kept.
#
# Defense window: artillery reaches 1.7, 3 and 3 times its tier's line reach; a point defense
# reaches the artillery's over 1.2, and outranges its tier's direct fire by at least 15%.
artillery_over_line = [1.7, 3.0, 3.0]
point_defense_under_artillery = 1.2
point_defense_over_direct_fire_min = 1.15
# A missile reaches twice the cannon of its role; a missile cruiser's least range is 15% of its
# reach. A cannon cruiser, in other factions, reaches half the missile cruiser's.
missile_over_cannon = 2.0
cruiser_min_range_share = 0.15
# An aircraft's gun at ground targets reaches 0.7 of its tier's anti-air (T3: the Mobile Flak).
aircraft_gun_over_anti_air = 0.7
#
# Secondary reaches (2026-11-27, BALANCE.md), each a
# rule that already held at two tiers or comes from one above, tests/reach_test.rs:
# - Mobile anti-air reaches 1.83 times its tier's line (the T1 and T2 lines both met it); static
#   anti-air 1.25 times its tier's mobile anti-air (at T3, which has none, 1.83 times the T3 line);
#   a ship's anti-air 1.2 times its tier's static anti-air, and the fleet's anti-air ship's 1.4.
# - An aircraft's anti-air reaches its tier's fighter (T2: the Fighter-Bomber's).
# - A sub-hunting torpedo reaches its tier's sub hunter: closing_share_role sub_hunter x
#   speed_navy x the sub hunter's time to kill (T3 as T2, a tier up).
# - A torpedo launcher reaches point_defense_over_direct_fire_min times its tier's navy direct
#   fire; a support ship's gun reaches its tier's navy line.
mobile_anti_air_over_line = 1.83
static_anti_air_over_mobile = 1.25
ship_anti_air_over_static = 1.2
cruiser_anti_air_over_static = 1.4
aircraft_anti_air_at_fighter = 1.0
support_gun_at_line = 1.0
# The battleship's broadside every 13.5 seconds, the model's damage a second in faster volleys.
battleship_broadside_seconds = 13.5

[price_list]
# Step 3 of the model (2026-11-26): what a unit costs, from what it can do.
# reports/plans/2026-11-26-ability-price-list.md works each unit through it.
#
#   cost = sum over jobs of sqrt(health x damage a second at the job) / sigma_job
#   sigma_job = anchor x tier efficiency x domain base / (1 + the job's prices)
#
# A job is a kind of target: surface, air, or submerged. Separate weapons firing at once each do
# their own job; one weapon that can hit several kinds counts once, at its best job, with a
# flexibility price. The anchor is the Medium Tank's strength per cost.
anchor_strength_per_cost = 2.806
tier_efficiency = [1.0, 1.0, 1.0, 1.0]
# The navy's base from the battle line ([battle_line] navy, 2026-11-27): the T2 fleet, its ships on
# the list, scores +0.6 against an equal cost of the T2 air force; 0.669 until then, solved by
# holding the T2 fleet (two destroyers, two cruisers) at its cost; 0.702, then 0.709 once every
# sensor was priced over its domain base (2026-11-27). Air's at T2 by holding the T2 air force's
# strike aircraft (four gunships, two fighter-bombers) at their cost (2026-11-26): 0.902, then
# 0.904 with every sensor over the base. A price every aircraft would pay alike, for flying,
# cancels in it. Each tier's air base comes from how deadly its anti-air is, which nothing else
# sets: anti-air guns and aircraft costs are set by the escort rules ([air]). At T1 (2026-11-27),
# Mobile Anti-Air downs a bomber in [kill_times] mobile_aa_t1_bomber, anti_air_escort_share then
# sets the T1 Bomber's cost, and the T1 base is what prices the bomber at that
# (balance::t1_air_base): 0.318, then 0.294 once the landed shares were measured again with turrets
# that fire only once laid, then 0.315 once every sensor, the Bomber's radar too, was priced over
# its domain base (2026-11-27), then 0.318 once aircraft flew on past the map's edge after a pass
# rather than stop on it (2026-11-27), then 0.323 once aircraft stopped keeping apart in flight
# (2026-11-27). The Interceptor is priced at it. At T2 the escort rule sets the
# Mobile Flak's gun against the strike aircraft as they are. At T3 (2026-11-27), from the battle
# line ([battle_line] t3_air): the base at which the Heavy Gunships are as good a buy against the
# standard T3 army as the T2 strike aircraft against the T2 army, both standing in ranks; T2's
# 0.902 until then.
# With gunships hovering in a drifting blob (2026-11-27), re-derived: navy 0.709 to 0.744, air_t3
# 1.005 to 0.972.
domain_base = { land = 1.0, navy = 0.670, air_t1 = 0.323, air_t2 = 0.904, air_t3 = 0.988 }
# Reach past the line's: x = c (r / r_line - 1), price x h / (1 - x h), h about 1 for shells and
# 0 for missiles. Short of it: -c (1 - r / r_line) (v_line / v). Speed: speed_share (1 - v_line / v).
speed_share = 0.3
# Splash: sqrt(n) - 1, n the damage one shot does across a standing or marching formation over its
# listed damage, measured.
# First volley (2026-11-26, for the Strategic Bomber's one great bomb a pass, and every weapon
# alike): a weapon's first volley lands as a fight starts, so over a fight it lands about half a
# volley more than its damage a second, the half shot [kill_times] counts. Its price is
# sqrt(1 + share x gap / fight) - 1: gap the seconds between its volleys (a bomber's pass), fight
# the [model] time to kill at its tier in the domain of what it hits (land's for the ground, the
# navy's at sea, air_to_air for aircraft). The Strategic Bomber's bomb every 13.5 seconds against
# 18.2 pays 0.17; a gun firing every second, next to nothing.
first_volley_share = 0.5
# Undodgeable weapons: sqrt(1 / (1 - d)) - 1, d the cost-weighted share of shell damage the
# standard T3 fleet dodges, turning back 0.3 s after each shell leaves: 0.44, so 0.34.
undodgeable = 0.34
# Out of cannons' reach (submerged): sqrt(1 / (1 - f)) - 1, f the share of its tier's fleet's
# anti-ship damage that cannot reach it. The T1 fleet for this is two frigates and two submarines,
# f 0.63, so 0.65. A submarine's torpedoes and missiles fire from under the water and pay it; its
# deck gun fires only on the surface and pays no premium. At every tier at T1's (2026-11-27, for
# the Strategic Missile Submarine's cruise missiles), until a tier has a sub hunter of its own to
# measure the share against.
submerged_t1 = 0.65
# A weapon with more than one kind of target: sqrt(1 / the largest share of the enemy mix a
# single-target weapon could hit) - 1. A navy is taken as half ships, half submarines, so a torpedo
# pays sqrt(2) - 1.
torpedo_flexibility = 0.41
# Torpedo decoys: as undodgeable, d the share of a submarine group's damage they stop, measured
# ([price_list.decoy_share]), on every job the unit does. The sub hunter's decoys fire 3x as often
# as the destroyer's (its torpedoes do 3x the damage a second): 33% stopped, so 0.22.
# Cargo (2026-11-27, the design owner's pick), a utility job: room for a full load of its tier's
# land line unit, at T2 energy prices, at the share of a full load the Light Air Transport, which
# only carries, pays for its own (0.667). Not over the domain base: the load is land units. A
# shield of a unit's own counts in its health, as a dome's does in its group's. Transports' weapons
# do a quarter of their tier's gunship's damage a second (the design owner's rule).
# Build power (2026-11-27), a utility job: its points at the least any unit that only builds pays
# for one (the T1 and T3 Engineers, 10.4), over the domain base. Each engineer is priced by the
# others. The Field Rig and the Command Rig carry it in their lists, still held.
# Strategic launching (2026-11-27, the design owner's pick), for a unit that builds strategic
# missiles and is not the launcher: the launcher's cost, half by its share of the launcher's build
# power and half by its share of its stock. Not over the domain base: the launcher is priced in
# minutes of a T3 economy ([economy]), not by a fight. Its build power is this job's, not a
# builder's.
# A sensor pays only for what it sees past its own vision, at the price per area of the cheapest
# building that has it: (range^2 - vision^2) / building range^2 x building cost. A ship's radar is
# shared by the radar ships of its tier's standard fleet, whose cover overlaps, so it pays that
# over their number (2026-11-26). Every sensor is then over its unit's domain base, as every other
# job is (2026-11-27, the design owner's pick), so that one radar is priced by one rule on a scout
# and on a warship; a unit that only sees, as the Air Scout, costs its sensors.

# Each tier's line, in its domain, which reach and speed are measured against (2026-11-27, as the
# list was worked by hand): the land line, and the navy's ships of each tier's line (the
# frigate at T1, the destroyer, the battleship). Aircraft have no line: speed is measured against
# air_speed, the T1 Interceptor's and the Fighter-Bomber's (units a tick, as the unit data).
line = { land = ["t1_medium_tank", "t2_heavy_tank", "t3_heavy_walker"], navy = ["t1_frigate", "t2_destroyer", "t3_battleship"] }
air_speed = 30
# A bomb's first-volley gap is between passes: its reload over the share it lands.
# Every unit whose cost is not the list's names what holds it ([price_list.held]); the rest
# must come within this of the list's price (tests/price_list_test.rs).
drift_max = 0.07
# A dome is priced by the strength it adds to the group it covers ([price_list.shield_groups],
# 2026-11-27): the group's cost x (sqrt(1 + E / H) - 1), H the group's health and E the dome's
# health, its regeneration over the [model] time to kill at its tier in its domain, and its hull's.
# A dome that cannot move is worth this much more for its cost, as a point defense is ([premiums]
# point_defense_holds_against_line_units).
immobile = 1.5
# A structure's reach (2026-11-27, the design owner's pick): priced as a unit's, past its tier's
# line, at its own closing share, the same at every tier, since the line must close on it alone
# under its fire. Solved (balance::derive_structure_closing_share): the share at which the list
# prices the T3 Heavy Point Defense at the most it can cost and still hold ([premiums]
# point_defense_holds_against_line_units), where the hold rule is tightest. The list prices the
# point defenses by it; other armed structures keep their own rules.
structure_closing_share = 0.535

# Each dome's group (2026-11-27): a force in [domains.forces], less the dome itself, or a position
# below. The Mobile Shield covers the standard T2 land army; the Escort Corvette the T2 fleet's
# destroyers and cruisers; the Shield Generator the [siege] T2 position's three point defenses; the
# Heavy Shield Generator the T3 position's. The Corvette has no anti-torpedo charge (taken off,
# 2026-11-27).
[price_list.shield_groups]
t2_mobile_shield = "t2_land_army"
t2_escort_corvette = "t2_fleet"
shield_generator = "position:t2"
t3_heavy_shield = "position:t3"

# The positions a static dome covers, as balance::T2_POSITION and T3_POSITION have them.
[price_list.positions]
t2 = { t2_point_defense = 3 }
t3 = { t3_heavy_point_defense = 3 }

# Splash, measured on a standing or marching formation of its tier's line (2026-11-26): the damage
# one shot does across it over its listed damage. A unit not listed pays none.
[price_list.splash]
t2_grenadier_walker = 1.5
t1_light_artillery = 1.5
t3_mobile_artillery = 6.5
t1_bomber = 1.88
t2_fighter_bomber = 2.18
t3_strategic_bomber = 3.03

# The share of a submarine group's torpedo damage a unit's decoys stop, measured (2026-11-26): the
# Torpedo Boat's of three attack submarines', the destroyer's of six.
[price_list.decoy_share]
t2_torpedo_boat = 0.33
t2_destroyer = 0.07

# Units the list prices whose cost something other than the list sets, and what. Every other such
# unit costs the list's price (tests/price_list_test.rs).
# The rigs' enhancements (2026-11-27, the design owner's pick): each costs what it adds to its rig
# (`price_list::enhancement_price`, `--balance-derive enhancements`), at the tier it is fitted at:
# its rig's, but no lower than T2, since a commander fits them once it has a T2 economy, and a
# fabrication pack at the tier it unlocks. Its gun, sensors and build power cost what they add to
# the rig's price on the list. Its health, its regeneration over the [model] time to kill and its
# shields cost the snipe price a point: what the cheapest force that destroys a rig in one pass,
# this weapon's, pays for a point of the health it takes ([kills]). Hiding it from radar costs
# the cheapest Stealth Field Generator, and its income its tier's payback ([economy]). One that
# builds on another pays only for what it adds, since it replaces it. Mass, energy and build time
# go together.
[price_list.enhancements]
snipe = "t3_strategic_bomber"
held = {}

# Factories (2026-11-27, the design owner's pick): a factory's cost is its build power, its hull
# and, for a headquarters and the Rig Yard, its tech. Build power at the build-power price, the
# least any unit that only builds pays for a point (the engineers' 10.4), wherever the point sits;
# health at the hull price, the plainest structure's cost a point of health (the Wall Section's,
# 0.007); not over a domain base, since a factory is priced by an economy, not by a fight. The tech
# price is what opening a tier costs: the design owner's knob, in materiel at its tier's prices,
# kept at what it was when the split was made (a headquarters' cost over its support factory's,
# the Rig Yard's over its build power and hull), to be tuned against [pace] with the AI's upgrade
# rules. T1 and support factories have none. Mass, energy and build time go together.
[price_list.factories]
hull = "wall"
tech = { land_factory_t2 = 851, air_factory_t2 = 486, naval_factory_t2 = 900, land_factory_t3 = 3941, air_factory_t3 = 3080, naval_factory_t3 = 7276, rig_yard = 1825 }

[price_list.held]
t1_medium_tank = "the anchor"
t1_light_walker = "the land solver's targets ([roles])"
t1_light_artillery = "the land solver's targets ([roles])"
t1_land_scout = "the land solver's targets ([roles])"
t2_heavy_tank = "the land solver's targets ([roles])"
t2_grenadier_walker = "the land solver's targets ([roles])"
t2_mobile_missile_launcher = "the land solver's targets ([roles])"
t2_assault_hovercraft = "the land solver's targets ([roles])"
t3_heavy_walker = "the land solver's targets ([roles])"
t3_siege_walker = "the land solver's targets ([roles])"
t1_mobile_aa = "its health per mass is the anchor's ([air] anti_air_health_over_bomb)"
t2_mobile_flak = "not derived yet: its cost is borrowed, its gun set by the escort rule"
t3_mobile_artillery = "the T3 line's micro cell: the middle of the costs where it holds"
t2_torpedo_bomber = "the duel it wins ([counters]): the least that needs twice the T2 fleet's cost, and the massed T3 fleet's, to break it"
t2_torpedo_boat = "the duel it wins ([counters]): the most that keeps 0.70 against an equal cost of submarines"
t1_point_defense = "the hold rule ([premiums]): the most it can cost and still hold, under the list's price"
# The commander is never built: its cost sets only its wreck and what destroying it is worth. Its
# health is set by the snipe rules ([kills]), its gun by [commander] (2026-11-27).
command_rig = "the design owner's cost: the commander is never built"
# The Spy Plane can look anywhere, which the list prices only through what its radar sees past
# its vision (42 at the T3 air base). Its cost is the design owner's until a price for seeing
# anywhere exists (2026-11-27, the plan's pick).
t3_spy_plane = "the design owner's cost until a price for seeing anywhere exists"

# Aircraft pay for the damage they land, not their card's (2026-11-26): anti-air against a bomber
# flying its run (the Strategic Bomber at T3, the T1 Bomber below), bombs, guns and torpedoes against
# a target holding still. The share each lands, as tests/kill_times_test.rs measures it (measured
# again 2026-11-27, with turrets that fire only once laid on their target; the Fighter-Bomber's anti-air
# again once its guns were fixed to its nose, 0.98 to 0.90).
[price_list.landed_share]
t1_interceptor = 0.91
t2_fighter_bomber_anti_air = 0.90
t3_air_superiority = 1.0
t1_bomber = 0.54
t2_fighter_bomber = 0.92
t3_strategic_bomber = 0.90
# The torpedo bomber flying a bomber's runs, five torpedoes a pass (2026-11-27): 0.82 to 0.87.
t2_torpedo_bomber = 0.87
t2_gunship = 1.0
t3_heavy_gunship = 1.0

[constants]
# Shared constants (2026-11-27, the design owner's OK to the plan): each is a family rule that
# every unit of the family follows, an identity knob the design owner owns, or a mechanic rule, at
# the numbers they have today (tests/constants_test.rs). Speeds are units a tick, as in
# data/units.toml. Land units' shells take their flight times from their roles ([micro],
# balance::t1_land_roles and on).
#
# Family rules. Every ship's gun at the surface flies at one speed, but the battleship's lobbed
# shells, which its broadside and [micro] set.
ship_gun_speed = 60
# Every torpedo: from a ship, a submarine, an aircraft or a launcher.
torpedo_speed = 30
# A tactical missile by what launches it: a structure's, slow, from far off; a ship's or a
# submarine's; a vehicle's, quick, from close in. Every strategic missile at one speed.
tactical_missile_speed = { structure = 28, ship = 32, vehicle = 40 }
strategic_missile_speed = 25
# A fighter's gun: the T1 Interceptor's, the T3 fighter's, and the Fighter-Bomber's anti-air.
fighter_gun_speed = 180
# The T1 Interceptor, the T1 Bomber and the Fighter-Bomber turn on one radius, in units, each at
# its own speed.
fighter_turn_radius = 64
#
# Identity knobs, the design owner's, kept in data/units.toml: each hull's turn rate and turn
# radius; each unit's speed, under [air]'s ratio rules; each aircraft's turn rate outside the
# radius family (the T3 fighter's, the gunships', the Strategic Bomber's, the scouts' and the
# transports'); each anti-air gun's shell speed outside the fighters'; each weapon's spread; each
# reload that no [kills], [volleys] or broadside rule sets; and the split of a ship's or an
# aircraft's cost between mass and energy (land units spend 5 energy a materiel, the anchor's).

[constants.veterancy]
# A unit reaches each rank by destroying its own mass this many times over, in thousandths, by its
# tier (a field rig as T1); the commander by its own steps of mass destroyed. Each rank adds this
# share of its base health, in thousandths, and reaching one heals this share at once (the
# commander more at each rank). Each rank regenerates this much a second, by row: T1, T2, T3 and
# commanders, field rigs, experimentals; ships take the row above their tier.
max_rank = 5
mass_permille_by_tier = [2000, 1500, 1250]
mass_permille_field_rig = 2000
commander_mass = [1000, 2250, 4000, 6500, 10000]
rank_health_permille = 100
promotion_heal_permille = 100
commander_promotion_heal_permille = [100, 200, 300, 400, 500]
regen_rows = [1, 3, 6, 9, 25]

[constants.wreckage]
# A wreck keeps this share of the unit's mass cost, in thousandths, then this share again by its
# tier (T1 to experimental; commanders and field rigs as T1), and this share again if it sank. It
# has this share of the unit's health.
mass_permille = 900
tech_permille = [900, 800, 700, 600]
sunk_permille = 600
health_permille = 900
