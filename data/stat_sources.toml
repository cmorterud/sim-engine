# What sets each stat of each unit (2026-11-28; src/stat_sources.rs, `--balance-derive
# stat-sources`), as `[price_list.unlisted]` and price_list::cost_rule say what sets each cost.
#
# Every number in data/units.toml other than cost is in one of ten families: health; body
# (radius, footprint, adjacency size); damage; range; speed; turning (turn rate and radius, and an
# aircraft's handling and height); timing (reload, volley, shell or missile speed, blast, spread,
# turret swivel, firing arc, setup, cruise height); sensors; economy (income, storage, build power
# and range, upkeep, energy a shot, adjacency); and special (domes, missile and torpedo defense,
# cargo, pads, stock, blasts on death, the Discharge, stealth and jamming). A family is derived
# only when every number in it is.
#
# Each unit names, for each family it has, what sets it, in words that start:
# - "rule: " a rule of the model or a target the design owner set, citing it as
#   `[section] key` in data/balance_targets.toml or as `module::function` in the code;
# - "anchor: " the design owner's own number, which others are set from, cited the same way;
# - "not derived yet: " and why: "held" (today's value, which no rule sets), "the
#   inspiration's", "kept" (inside a band or past a floor that does not pin it), "today's value
#   written down" (as a target), or "an identity knob" (one `[constants]` names, at today's).
#
# tests/stat_sources_test.rs holds this table to the unit data: every family a unit has is
# named, every citation resolves, the rules no other test checks are checked there, and the count
# not derived yet can only fall. Each pass of the derivation plan (2026-11-28, the design owner's
# "Yes" to deriving every stat in passes) turns some of these into rules.

[units.command_rig]
health = "rule: the snipes that destroy it, [kills] t3_strategic_bomber.command_rig, [kills] tactical_missile_launcher.command_rig and [broadsides] t3_battleship.command_rig"
body = "not derived yet: held, today's radius"
damage = "rule: [commander] holds_against_medium_tanks, the least gun that does"
range = "anchor: the design owner's reach, 1.26 times the Medium Tank's ([commander] holds_against_medium_tanks)"
speed = "not derived yet: an identity knob ([constants]), today's top speed"
turning = "not derived yet: an identity knob ([constants]), today's turn rate and radius"
timing = "rule: its shell reaches full range in the anchor's flight time (balance::shell_speed), its reload is the design owner's ([commander] holds_against_medium_tanks), its turret's swivel balance::turret_swivel"
sensors = "not derived yet: held, its deep scan; its vision is a little past its longest gun, as the land line sees (balance::gun_sight)"
economy = "not derived yet: held, its income, storage and build power"
special = "anchor: the design owner's Discharge, at least [commander] discharge_kills_every_t1_land_unit; its reactor's blast is its own health"

