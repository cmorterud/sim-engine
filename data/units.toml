# A dome that stops enemy shells from outside, while those under it fire out freely
# (GAME_SPECIFICATION.md §8.1). Tier 2. Upkeep is energy per second while the dome is up.
# It regenerates a little faster than one cruiser's missiles wear it down (181.6 a second), so
# that it holds against one cruiser for as long as it is paid for, and falls to two (2026-11-25,
# reports/plans/2026-11-25-weapons-nukes-shields.md). It heals its whole health in about 70
# seconds, so its health is 70 times its regeneration, and one battleship broadside takes it
# down exactly; it comes back 20 seconds after it falls, at full health (the design owner's
# numbers, 2026-11-25).
[[unit]]
