# Unit and structure data for the vertical slice (GAME_SPECIFICATION.md §18-19).
#
# Values are whole numbers or quoted decimals, such as "2.5". TOML floats are rejected
# when loading, so that no float rounding can enter the simulation.
# Rates are per second, except speeds, which are units per tick. Turn rates are degrees per second, and turn radii are units: without one, a unit turns on the spot.
# One terrain cell is 20 units. These are starting values for tuning, not final balance.
version = 1

[[unit]]
id = "command_rig"
name = "Command Rig"
class = "commander"
tier = 1
mass = 2000
energy = 10000
build_time = 1
health = 18000
speed = "3.4"
turn_rate = 90
radius = 16
vision = 520
# It walks the seabed too.
movement = "seabed"
build_power = 10
build_range = 200
# Its fabrication packs (the enhancements below) unlock the T2 and T3 structures on its list.
builds = ["land_factory_t1", "mass_extractor", "power_generator", "mass_storage", "energy_storage", "t1_point_defense", "radar", "shield_generator", "tactical_missile_launcher", "tactical_missile_defense", "stealth_field_generator", "strategic_missile_launcher", "strategic_missile_defense", "rig_yard", "geothermal_plant", "mass_fabricator", "mass_fabricator_t3", "air_factory", "naval_factory", "t1_aa_turret", "airfield", "t2_flak", "t3_sam", "mass_extractor_t2", "power_generator_t2", "radar_t2", "t2_point_defense", "land_factory_t2_support", "air_factory_t2_support", "mass_extractor_t3", "power_generator_t3", "deep_scan_array", "land_factory_t3_support", "air_factory_t3_support", "t2_artillery", "t3_artillery", "naval_factory_t2_support", "naval_factory_t3_support", "t1_sonar", "t1_torpedo_launcher", "t2_sonar", "t2_torpedo_launcher", "wall", "t3_heavy_point_defense", "t3_heavy_shield", "field_workshop"]
weapon = { range = 440, reload_ticks = 7, projectile_speed = 50, damage = 70, turn_rate = 180 }
# The inspiration's Discharge: 7,500 in store to fire; on landing, up to 90% of the store at 6 energy a point,
# from 1,250 to 15,000 damage, as much as the toughest enemy there takes; 400 to commanders, 800
# to structures, a blast of 50, and a look 54 round for the toughest.
discharge = { energy_required = 7500, energy_share_permille = 900, energy_per_damage = 6, min_damage = 1250, max_damage = 15000, commander_damage = 400, structure_damage = 800, splash_radius = 50, search_radius = 54, reload_ticks = 33 }
mass_income = 1
energy_income = 20
mass_storage = 650
energy_storage = 4000
# Its reactor's blast takes another commander with it, at full health, so commanders that die
# together, one setting off the other, make a draw.
death_explosion = { damage = 18000, radius = 300 }
deep_scan = 480

