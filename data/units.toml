name = "Shield Generator"
class = "defense"
tier = 2
mass = 600
energy = 6000
build_time = 1150
health = 250
footprint = 3
vision = 400
shield = { radius = 260, health = 13020, regen = 186, recharge_seconds = 20, upkeep = 30 }

