# Unit and structure data for the vertical slice (GAME_SPECIFICATION.md §18-19).
#
# Values are whole numbers or quoted decimals, such as "2.5". TOML floats are rejected
# when loading, so that no float rounding can enter the simulation.
# Rates are per second, except speeds, which are units per tick. Turn rates are degrees per second, and turn radii are units: without one, a unit turns on the spot.
# One terrain cell is 20 units. These are starting values for tuning, not final balance.
version = 1

