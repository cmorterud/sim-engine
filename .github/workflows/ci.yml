name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned so that a new compiler release cannot break the build unexpectedly.
      RUST_VERSION: "1.99.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Build
        run: cargo build --release --locked

      # Some tests only run in release builds, such as the full-length determinism checks.
      - name: Test (release)
        run: cargo test --release --locked

      # Arithmetic overflow only fails loudly in unoptimized builds.
      - name: Test (unoptimized)
        run: cargo test --locked

      # Compiled but not run: timing limits would give false failures on shared runners.
      - name: Check that benchmarks compile
        run: cargo bench --no-run --locked
