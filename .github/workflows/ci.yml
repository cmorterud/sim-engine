name: CI

on:
  push:
    branches: [main]
  # Every pull request into main gets the same checks, so that main only takes what passes.
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned so that a new compiler release cannot break the build unexpectedly.
  RUST_VERSION: "1.99.1"
  # Disk space on the runners is tight, and the unoptimized test binaries, each with the whole
  # graphics stack and full debug information, ran it out mid-link (the linker died with a bus
  # error). Line tables keep file and line in panics at a fraction of the size, and incremental
  # caches are no use on a fresh runner.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Other games' names appear only in PROVENANCE.md (GAME_SPECIFICATION.md §20). This fails on any
  # entry of the deny-list anywhere else, matched as whole words in any case, in text files only.
  provenance:
    name: Provenance names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No other games' names outside PROVENANCE.md
        run: |
          if git grep -n -I -i -w -E -f .github/denylist.txt -- . ':!PROVENANCE.md' ':!.github/denylist.txt'; then
            echo "::error::Names on .github/denylist.txt belong only in PROVENANCE.md"
            exit 1
          fi

  # Compiling takes nearly all of the time, and each profile compiles everything separately,
  # so each job builds for itself and keeps its own cache instead of sharing artifacts.
  build-and-test:
    name: Build and test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let the other job finish, so that one run shows every failure.
      fail-fast: false
      matrix:
        include:
          # Some tests only run in release builds, such as the full-length determinism checks.
          - profile: release
            flags: --release
          # Arithmetic overflow only fails loudly in unoptimized builds.
          - profile: unoptimized
            flags: ""
    steps:
      - uses: actions/checkout@v7

      # The runner comes with toolchains this project never uses; removing them frees many
      # gigabytes for the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # The audio library needs the system's sound headers to compile. The package mirrors
      # sometimes time out, so each download is retried, and the whole install tried again.
      - name: Install audio headers
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev && exit 0
            echo "Install attempt $attempt failed; trying again in 20 seconds."
            sleep 20
          done
          exit 1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUST_VERSION }}-${{ matrix.profile }}-

      - name: Build
        run: cargo build --locked ${{ matrix.flags }}

      - name: Test
        run: cargo test --locked ${{ matrix.flags }}

      # Every target, the tests, examples, and benchmarks too, with warnings as errors. Once, in
      # the release job, which has the release build cached already.
      - name: Lint
        if: matrix.profile == 'release'
        run: cargo clippy --locked --release --all-targets -- -D warnings

      # So that a failure from a full disk says so.
      - name: Disk space left
        if: always()
        run: df -h / && du -sh target

      # Compiled but not run: timing limits would give false failures on shared runners.
      - name: Check that benchmarks compile
        if: matrix.profile == 'release'
        run: cargo bench --no-run --locked

  # The simulation must give the same bits on every machine: the release tests check the golden
  # checksums on x86_64, and this checks them on 64-bit ARM, as Apple silicon is.
  determinism-arm:
    name: Determinism on ARM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install audio headers
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev && exit 0
            echo "Install attempt $attempt failed; trying again in 20 seconds."
            sleep 20
          done
          exit 1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm-${{ env.RUST_VERSION }}-

      - name: Golden checksums
        run: cargo test --locked --release --test determinism_test

  # The browser build is published only once every gate passes, so it must be one of them.
  browser-build:
    name: Browser build compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown --component clippy
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-wasm-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUST_VERSION }}-wasm-check-

      - name: Build and lint for the browser
        run: cargo clippy --locked --release --target wasm32-unknown-unknown --bin sim-engine -- -D warnings

      - name: Install Trunk
        env:
          # Keep in step with the Pages build.
          TRUNK_VERSION: "0.22.1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/trunk"
          curl -fsSL --retry 3 "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/trunk"
          echo "$RUNNER_TEMP/trunk" >> "$GITHUB_PATH"

      - name: Bundle the browser game
        run: trunk build --release --locked

      - name: Install headless Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-smoke"
          "$RUNNER_TEMP/browser-smoke/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/browser-smoke/bin/python" -m playwright install --with-deps --only-shell chromium

      - name: Smoke-test browser startup and redraw
        run: |
          "$RUNNER_TEMP/browser-smoke/bin/python" scripts/browser_smoke.py
