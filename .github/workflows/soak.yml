name: Soak

# The soak plays whole AI-vs-AI matches and replays each from its command log (README,
# Validate): hundreds of matches, too heavy to run on a laptop for every change. Here it is
# split across runners, one shard of seeds each, all running the same release binary.
on:
  # The full soak, nightly on main's newest commit (2:17 AM Eastern standard time, 3:17 in
  # summer, since cron keeps UTC), rather than on every push: it took about an hour, and the
  # website no longer waits for it (pages.yml). A night it fails tells the repository's owner
  # (the alert job).
  schedule:
    - cron: "17 7 * * *"
  # A smaller soak for each pull request into main (the plan below): enough matches on every map
  # and team size to catch one that never ends, a replay that differs, or a panic, in a fraction
  # of the time, but too few to judge a side's lean. The full soak plays it that night.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skirmish_matches:
        description: Matches on the generated skirmish map
        default: "200"
      bundled_matches:
        description: Matches on each bundled map
        default: "120"
      team_matches:
        description: 2v2 matches on each map with team starts, and 3v3s on Saddleback
        default: "60"
      four_team_matches:
        description: 4v4 matches on each map with starts for eight
        default: "20"
      shard_size:
        description: Matches per runner
        default: "25"
      maps:
        description: "Only these maps, by name, space-separated (skirmish counts as one; empty plays every map)"
        default: ""
      first_seed:
        description: "The first seed: more matches on fresh seeds, for a side-bias question"
        default: "1"
      alert:
        description: "If it fails, report it as a failed night would, to check that the alert arrives"
        type: boolean
        default: false

permissions:
  contents: read
  # To find the last commit on main whose soak passed (the plan job).
  actions: read

# One soak at a time for each branch, and only its newest commit waits: a newer push takes the
# place of the one waiting, but never cuts off the soak running. Waiting in line for every
# commit cost hours when main moved faster than a soak, and only main's newest commit is ever
# published (pages.yml). A commit left unsoaked this way is still covered, since the next soak
# plays every change since the last one that passed (the plan job).
concurrency:
  group: soak-${{ github.ref }}

env:
  # Kept in step with CI, so that this workflow reuses the release build cache CI saves.
  RUST_VERSION: "1.99.1"
  CARGO_INCREMENTAL: "0"

jobs:
  # Splits the matches into shards of seeds, one runner each. A pull request plays 40 skirmish
  # matches, 20 on each bundled map, 10 of each team match, and 5 4v4s, in shards of 20 (10 on
  # Scattered Isles, whose matches run longest): thirteen runners rather than nineteen, since
  # the account runs only so many jobs at once, and smaller shards spent longer waiting for a
  # runner than playing. A pull request or a night that changes nothing the soak runs (the
  # drawing, the sound, the interface, the docs) plays no soak at all. A night on main that
  # changes something the soak runs plays the 200 skirmish
  # matches of the exit criteria and 120 on each bundled map (Highland, Twin Passes, Saddleback,
  # Stillwater, and Scattered Isles): enough matches that a side winning 60% of them stands out
  # from chance. And 60 2v2s on each of Saddleback, Stillwater, and Scattered Isles, four AIs,
  # which take longer each, 60 3v3s on Saddleback, and 20 4v4s on Scattered Isles, eight AIs:
  # too few to judge a lean, but enough to show that they finish and replay.
  plan:
    name: Plan the shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      run: ${{ steps.changes.outputs.run }}
    steps:
      # The merge commit and its first parent, main as it stands, are enough to see what the
      # pull request changes. A nightly run fetches the commit it is compared with below.
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 2

      # What the soak runs: the simulation and its arithmetic, the AI, the soak itself, the
      # command line that starts it, the unit and map data, the dependencies, and this workflow.
      # A change that touches none of them cannot change what the soak finds, so it plays no
      # soak. A pull request is compared with main as it stands. A nightly run is compared with
      # the newest commit on main whose nightly soak passed, played or skipped (a skipped one is,
      # for the soak, the same as the one it was compared with), so that a night that failed
      # leaves its changes to be soaked again. With no such commit to compare with, or a run by
      # hand, it always soaks.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=HEAD^1
          else
            base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow soak.yml --branch main --event schedule \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            echo "Last commit on main whose soak passed: ${base:-none}"
            if [ -z "$base" ] || ! git fetch --depth=1 origin "$base"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          pattern='^(src/sim/|src/math/|src/ai\.rs$|src/ai_strategy\.rs$|src/soak\.rs$|src/lib\.rs$|src/main\.rs$|data/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/soak\.yml$)'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the soak runs has changed since $base, so this run plays no soak." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: plan
        env:
          # A nightly run plays the full soak; a pull request the smaller one, in shards of 20,
          # which leave each map and team size on a runner or two.
          SKIRMISH: ${{ inputs.skirmish_matches || (github.event_name == 'pull_request' && '40' || '200') }}
          BUNDLED: ${{ inputs.bundled_matches || (github.event_name == 'pull_request' && '20' || '120') }}
          SHARD: ${{ inputs.shard_size || (github.event_name == 'pull_request' && '20' || '25') }}
          # Scattered Isles' matches run longest, about 36 s each on a runner against 6 to 15 on
          # the other maps, so a pull request splits its 20 across two runners, to finish with
          # the rest.
          ISLES_SHARD: ${{ inputs.shard_size || (github.event_name == 'pull_request' && '10' || '25') }}
          TEAMS: ${{ inputs.team_matches || (github.event_name == 'pull_request' && '10' || '60') }}
          FOURS: ${{ inputs.four_team_matches || (github.event_name == 'pull_request' && '5' || '20') }}
          MAPS: ${{ inputs.maps || '' }}
          FIRST_SEED: ${{ inputs.first_seed || '1' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          shard = max(1, int(os.environ["SHARD"]))
          isles_shard = max(1, int(os.environ["ISLES_SHARD"]))
          only = set(os.environ["MAPS"].split())
          start = int(os.environ["FIRST_SEED"])
          shards = []
          for map_name, matches, teams, size in [("skirmish", int(os.environ["SKIRMISH"]), "", shard),
                                           ("highland", int(os.environ["BUNDLED"]), "", shard),
                                           ("twin_passes", int(os.environ["BUNDLED"]), "", shard),
                                           ("saddleback", int(os.environ["BUNDLED"]), "", shard),
                                           ("saddleback", int(os.environ["TEAMS"]), "2v2", shard),
                                           ("saddleback", int(os.environ["TEAMS"]), "3v3", shard),
                                           ("stillwater", int(os.environ["BUNDLED"]), "", shard),
                                           ("stillwater", int(os.environ["TEAMS"]), "2v2", shard),
                                           ("scattered_isles", int(os.environ["BUNDLED"]), "", isles_shard),
                                           ("scattered_isles", int(os.environ["TEAMS"]), "2v2", shard),
                                           ("scattered_isles", int(os.environ["FOURS"]), "4v4", shard)]:
              if only and map_name not in only:
                  continue
              for first in range(start, start + matches, size):
                  count = min(size, start + matches - first)
                  map_arg = "" if map_name == "skirmish" else f"--map {map_name} "
                  team_arg = f" --teams {teams}" if teams else ""
                  label = f"{map_name} {teams}".strip()
                  shards.append({"name": f"{label} {first}-{first + count - 1}",
                                 "args": f"{map_arg}--soak {count} --seed {first}{team_arg}"})
          print("shards=" + json.dumps(shards))
          EOF

  build:
    name: Build the release binary
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The audio library needs the system's sound headers to compile. The package mirrors
      # sometimes time out, so each download is retried, and the whole install tried again.
      - name: Install audio headers
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev && exit 0
            echo "Install attempt $attempt failed; trying again in 20 seconds."
            sleep 20
          done
          exit 1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # The same key as CI's release job, so a push usually finds its build already cached.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUST_VERSION }}-release-

      - name: Build
        run: cargo build --locked --release --bin sim-engine

      - uses: actions/upload-artifact@v7
        with:
          name: sim-engine
          path: target/release/sim-engine
          retention-days: 3

  soak:
    name: Soak (${{ matrix.name }})
    needs: [plan, build]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every shard reports, so that one run shows every failing seed.
      fail-fast: false
      max-parallel: 40
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sim-engine

      # The binary links the system's sound library, which the runner may not have.
      - name: Install the sound library if missing
        run: |
          chmod +x sim-engine
          if ldd sim-engine | grep -q "not found"; then
            sudo apt-get update && sudo apt-get install -y libasound2t64
          fi
          ldd sim-engine | grep "not found" && exit 1 || true
          echo "cores: $(nproc)"

      # Tick times are reported but not gated: on a shared runner they measure its other load
      # as much as the game. Unfinished matches, replay mismatches, and panics still fail.
      - name: Soak
        run: |
          set -o pipefail
          ./sim-engine ${{ matrix.args }} --threads "$(nproc)" --no-tick-gate | tee soak.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-${{ strategy.job-index }}
          path: soak.txt
          retention-days: 14

  summary:
    name: Summary
    needs: soak
    if: always() && needs.soak.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: soak-*

      # One table for the whole run: wins by side, matches that did not finish, and replays
      # that did not match, per map. Fails if any shard failed.
      - name: Summarize
        run: |
          python3 - <<'EOF' > summary.md
          import glob, re
          totals = {}
          for path in sorted(glob.glob("soak-*/soak.txt")):
              text = open(path).read()
              mapname = re.search(r"^map (\S+):", text, re.M)
              teams = re.search(r"^teams: (\S+)", text, re.M)
              key = (mapname.group(1) if mapname else "skirmish") + (f" {teams.group(1)}" if teams else "")
              t = totals.setdefault(key, [0, 0, 0, 0, 0, [], []])
              wins = re.search(r"Blue wins (\d+), Red wins (\d+), draws (\d+), unfinished (\d+)", text)
              mismatches = re.search(r"replay mismatches (\d+)", text)
              if wins:
                  for i in range(4):
                      t[i] += int(wins.group(i + 1))
              if mismatches:
                  t[4] += int(mismatches.group(1))
              seeds = re.search(r"unfinished seeds: \[([^\]]*)\]", text)
              if seeds:
                  t[5] += [seed.strip() for seed in seeds.group(1).split(",")]
              drawn = re.search(r"drawn seeds: \[([^\]]*)\]", text)
              if drawn:
                  t[6] += [seed.strip() for seed in drawn.group(1).split(",")]
          # How likely a split at least this lopsided is if both sides are equally strong: a
          # two-sided binomial test of the decided matches. Below 0.05 suggests a real lean.
          from math import comb
          def p_value(blue, red):
              n = blue + red
              if n == 0:
                  return 1.0
              k = min(blue, red)
              tail = sum(comb(n, i) for i in range(k + 1)) / 2 ** n
              return min(1.0, 2 * tail)
          print("| Map | Blue | Red | Blue share | p (even sides) | Draws | Unfinished | Replay mismatches | Unfinished seeds | Drawn seeds |")
          print("| :-- | --: | --: | --: | --: | --: | --: | --: | :-- | :-- |")
          for key, t in totals.items():
              decided = t[0] + t[1]
              share = f"{100 * t[0] / decided:.1f}%" if decided else "-"
              print(f"| {key} | {t[0]} | {t[1]} | {share} | {p_value(t[0], t[1]):.3f} | {t[2]} | {t[3]} | {t[4]} | {', '.join(t[5])} | {', '.join(t[6])} |")
          EOF
          tee -a "$GITHUB_STEP_SUMMARY" < summary.md

      # For the alert, which puts the table in the notification itself.
      - uses: actions/upload-artifact@v7
        with:
          name: summary-table
          path: summary.md
          retention-days: 14

      - name: Fail if any shard failed
        if: needs.soak.result != 'success'
        run: |
          echo "A soak shard failed: see its log."
          exit 1

  # A nightly soak that fails tells the repository's owner: which jobs failed, and the summary's
  # table, so that the failing seeds are in the notification itself. With issues turned on, it
  # opens an issue, which notifies the repository's watchers, or comments on the one still open,
  # so that failing nights gather in one place until it is closed. With issues turned off, as they
  # are here, it comments on the commit it soaked instead, mentioning the owner, which notifies
  # them as an issue would: the first night that failed (2026-11-25) could only try to open an
  # issue, and nobody heard. If neither can be posted, this job fails.
  alert:
    name: Report a failed nightly soak
    needs: [plan, build, soak, summary]
    if: failure() && (github.event_name == 'schedule' || inputs.alert)
    runs-on: ubuntu-latest
    permissions:
      # To name the jobs that failed.
      actions: read
      # A commit comment needs only read access to the code.
      contents: read
      issues: write
    steps:
      # The summary's table, if the soak got that far.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: summary-table

      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Nightly soak failed"
          failed=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")') || failed=""
          {
            echo "@$OWNER The nightly soak failed on $GITHUB_SHA: $RUN_URL"
            echo
            echo "Failed: ${failed:-see the run}."
            echo
            if [ -s summary.md ]; then
              cat summary.md
            else
              echo "The soak did not get as far as its summary; the run's failing job has the reason."
            fi
          } > body.md
          posted=""
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = true ]; then
            number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty") || number=""
            if [ -n "$number" ]; then
              posted=$(gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file body.md) || posted=""
            else
              posted=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md) || posted=""
            fi
          fi
          if [ -z "$posted" ]; then
            posted=$(gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@body.md --jq .html_url)
          fi
          echo "Reported at $posted" | tee -a "$GITHUB_STEP_SUMMARY"
