name: Web build

# Builds the game for the browser and publishes it on GitHub Pages, so that it can be played
# from a link: https://codymorterud.com/sim-engine/
#
# Only once every gate has passed: this starts whenever CI or the soak finishes on main, and
# publishes only if both passed on the same commit, and that commit is still main's newest, so
# that a broken build or an older one never replaces what is there.
on:
  workflow_run:
    workflows: [CI, Soak]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Only the newest commit is worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  TRUNK_VERSION: "0.22.1"
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: Check that every gate passed
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ready=true
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" != "$SHA" ]; then
            echo "$SHA is no longer main's newest commit ($newest)"
            ready=false
          fi
          for workflow in ci.yml soak.yml; do
            result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$SHA" --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | .[0].conclusion // "not finished"')
            echo "$workflow on $SHA: $result"
            [ "$result" = success ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build for the browser
    needs: gates
    if: needs.gates.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gates.outputs.sha }}

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      # trunk builds the game, runs wasm-bindgen, and writes the page, from index.html.
      - name: Install trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin trunk
          trunk --version

      # The page lives under /sim-engine/ on GitHub Pages, so its files are linked from there.
      - name: Build
        run: trunk build --release --locked --public-url /sim-engine/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
