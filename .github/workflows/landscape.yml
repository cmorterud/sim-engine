name: Landscape pictures

# Pictures of the land and sea on three maps (`--landscape`), from the pull request and from
# main, laid side by side, for reviewing changes to how the terrain and water look. Software
# rendered, so they are for looking at, never compared pixel by pixel as a test.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/render/**"
      - "src/minimap.rs"
      - ".github/workflows/landscape.yml"
      - "scripts/landscape_pairs.py"
      - "scripts/landscape_maps.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landscape-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  CARGO_INCREMENTAL: "0"
  MAPS: "stillwater scattered_isles highland"

jobs:
  landscape:
    name: Landscape pictures
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install headers and a software display
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 python3-pil && exit 0
            echo "Install attempt $attempt failed; trying again in 20 seconds."
            sleep 20
          done
          exit 1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-autotest-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUST_VERSION }}-release-

      - name: Pictures from this branch
        run: |
          cargo build --locked --release
          scripts/landscape_maps.sh ./target/release/sim-engine pictures/after $MAPS

      # Main's build of the same program, if it has `--landscape` yet.
      - name: Pictures from main
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cd ../base
          if ! grep -q -- '--landscape' src/main.rs; then
            echo "main has no --landscape yet; only this branch's pictures are kept."
            exit 0
          fi
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --release
          "$GITHUB_WORKSPACE/scripts/landscape_maps.sh" "$GITHUB_WORKSPACE/target/release/sim-engine" "$GITHUB_WORKSPACE/pictures/before" $MAPS

      - name: Side by side
        if: github.event_name == 'pull_request'
        run: |
          if [ -d pictures/before ]; then
            python3 scripts/landscape_pairs.py pictures/before pictures/after pictures/pairs | tee pairs.txt
            { echo "## Landscape, main on the left"; echo; echo '```'; cat pairs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: landscape-pictures
          path: |
            pictures/pairs
            pictures/after
          if-no-files-found: error
