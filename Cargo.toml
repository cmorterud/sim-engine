[package]
name = "sim-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
# Deterministic Fixed-Point Math
fixed = { version = "1.28", features = ["serde"] }

# Lightweight Archetypal ECS
hecs = "0.10"

# Graphics, Windowing & Presentation
wgpu = "0.20"
winit = { version = "0.29", features = ["rwh_05"] }
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"

# Render-Side Interpolation Math (NOT used in simulation)
glam = "0.27"

# Deterministic Hashing
twox-hash = "1.6"

# Unit data files
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Menus, resource bar, and overlays
egui = "0.28"
egui-wgpu = "0.28"
egui-winit = { version = "0.28", default-features = false, features = ["links", "wayland", "x11"] }

# Logging
log = "0.4"
env_logger = "0.11"
cpal = "0.18.2"

# The unit portrait atlas (assets/portraits.png), read at startup and written by its generator.
png = "0.17"

# Clocks that also work in the browser, where std::time::Instant panics.
web-time = "1"

# The browser build: started from JavaScript, drawing with WebGPU or WebGL2 into a canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "0.20", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Document", "HtmlDocument"] }
# Sound through the browser's Web Audio.
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
console_error_panic_hook = "0.1"
console_log = "1"
# A dependency of a dependency picks random numbers (never in the simulation), and needs the
# browser's source for them.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sim_benchmark"
harness = false

# Keep unoptimized test runs fast enough to use, with overflow checks still on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
