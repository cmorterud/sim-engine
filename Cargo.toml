[package]
name = "sim-engine"
version = "0.1.0"
edition = "2021"
# The game. `cargo run --bin map-download` fetches maps to play with --map.
default-run = "sim-engine"

[dependencies]
# Deterministic Fixed-Point Math
fixed = { version = "1.28", features = ["serde"] }

# Lightweight Archetypal ECS
hecs = "0.10"

# Graphics, Windowing & Presentation
wgpu = "0.20"
winit = { version = "0.29", features = ["rwh_05"] }
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"

# Render-Side Interpolation Math (NOT used in simulation)
glam = "0.27"

# Deterministic Hashing
twox-hash = "1.6"

# Unit data files
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Menus, resource bar, and overlays
egui = "0.28"
egui-wgpu = "0.28"
egui-winit = { version = "0.28", default-features = false, features = ["links", "wayland", "x11"] }

# Logging
log = "0.4"
env_logger = "0.11"
cpal = "0.18.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sim_benchmark"
harness = false

# Keep unoptimized test runs fast enough to use, with overflow checks still on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
